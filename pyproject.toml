[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcel"
version = "1.3.0"
description = "Desktop OCR dictionary with multilingual Yomitan lookup"
readme = "README.md"
license = "GPL-3.0"
authors = [
    {name = "rtr46"}
]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.9.1",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",

    "pynput>=1.7.8; sys_platform != 'darwin'",
    "pynput==1.8.2; sys_platform == 'darwin'",
    "mss>=10.0.0",
    "requests>=2.32.4",
    "Pillow>=11.2.1",
    "protobuf>=6.33.1",
    # macOS uses its built-in Vision engine; no OCR model download is needed.
    "meikiocr>=0.3.5; sys_platform != 'darwin'",
    # Keep the established runtime where its wheels exist (through Python 3.13).
    "onnxruntime==1.31.1; sys_platform == 'win32' and python_version < '3.14'",
    "python-xlib~=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "platformdirs",
    "romkan2==0.1.1",
    "huggingface-hub>=2.1.1",
    "zeyrek==0.1.3",
]

[project.urls]
Repository = "https://github.com/namidanokisetsu/wordcel"

[project.scripts]
wordcel = "wordcel.main:main"
wordcel-search = "wordcel.scripts.quick_lookup:main"
wordcel-translation = "wordcel.scripts.translation_server:main"

[project.optional-dependencies]
morphology = [
    "stanza==1.15.0",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# Paddle and PaddleX, including their contrib OpenCV wheel, are installed by
# the setup worker into an isolated engine site. Keeping them out of the
# source environment prevents cv2 ownership from depending on pip order.
turkish-ocr = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["wordcel*"]

[tool.setuptools.package-data]
wordcel = ["scripts/deconjugator.json", "resources/icon.ico", "resources/icon.svg", "resources/tray.svg", "resources/licenses/*.txt", "resources/fonts/*.ttf"]

name: reusable macos build

on:
  workflow_call:
    inputs:
      require_signing:
        type: boolean
        default: false
    secrets:
      MACOS_SIGNING_P12:
        required: false
      MACOS_SIGNING_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      require_signing:
        description: Require persistent release signing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            torch: '2.8.0'
          - runner: macos-15-intel
            arch: x86_64
            torch: '2.2.2'

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: check signing credentials
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ "$REQUIRE_SIGNING" == true || -n "$MACOS_SIGNING_P12" || -n "$MACOS_SIGNING_PASSWORD" ]]; then
            test -n "$MACOS_SIGNING_P12" && test -n "$MACOS_SIGNING_PASSWORD" || {
              echo 'Both macOS signing secrets are required.' >&2
              exit 1
            }
          fi

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2' 'torch==${{ matrix.torch }}' stanza==1.14.0
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: check native bridge and lookup fixtures
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          python -c "import Vision, Quartz; from wordcel.ocr.macos_vision import recognize; from wordcel.scripts.quick_lookup import main"
          python -m wordcel.scripts.quick_lookup --check-runtime
          python -m unittest discover -s tests

      - name: verify native architecture
        run: |
          python -c "import platform; assert platform.machine() == '${{ matrix.arch }}', platform.machine()"

      - name: clean previous builds
        run: rm -rf build dist || true

      - name: build with pyinstaller (macos)
        run: pyinstaller wordcel.macos.spec

      - name: sign release app
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -n "$MACOS_SIGNING_P12" ]]; then
            bash packaging/sign-macos.sh dist/wordcel.app
          fi

      - name: verify app resources and signature
        run: |
          test -f dist/wordcel.app/Contents/Resources/wordcel/scripts/deconjugator.json
          python -c "import plistlib,tomllib; expected=tomllib.load(open('pyproject.toml','rb'))['project']['version']; info=plistlib.load(open('dist/wordcel.app/Contents/Info.plist','rb')); assert info['CFBundleVersion']==expected and info['CFBundleShortVersionString']==expected,info"
          codesign --verify --deep --strict dist/wordcel.app
          # Native imports only: this exits before Qt, capture or accessibility.
          dist/wordcel.app/Contents/MacOS/wordcel --check-runtime

      - name: create dmg
        run: |
          rm -rf dist/dmg-root
          mkdir -p dist/dmg-root
          cp -R dist/wordcel.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Wordcel" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/wordcel.macos.${{ matrix.arch }}.dmg

      - name: upload macos artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcel-macos-${{ matrix.arch }}
          path: |
            dist/wordcel.macos.${{ matrix.arch }}.dmg

# .github/workflows/build-windows.yml
name: reusable windows build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: "the name of the windows artifact"
        value: ${{ jobs.build-windows.outputs.artifact_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[morphology,turkish-ocr]'
          pip install pyinstaller==6.22.3

      - name: check setup flow
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p test_first_run.py
          python -m unittest discover -s tests -p test_window_focus.py
          python -m unittest discover -s tests -p test_paddle_worker.py

      - name: clean previous builds
        run: |
          rmdir build -r -force -ErrorAction SilentlyContinue || true
          rmdir dist -r -force -ErrorAction SilentlyContinue || true

      - name: install isolated Paddle build site
        run: |
          python -m pip install --target build/paddle-build-site paddleocr==3.7.0 'paddlex[ocr-core]==3.7.2' paddlepaddle==3.2.2 opencv-contrib-python==4.10.0.84

      - name: build Windows installer
        run: ./Build-Windows.ps1 -Python python -ISCC 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: verify bundled runtime
        run: |
          & ./dist/wordcel/wordcel-cli.exe --check-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime check failed' }

      - name: verify optional engines
        run: |
          & ./dist/wordcel/wordcel-cli.exe --setup-engine paddle
          if ($LASTEXITCODE -ne 0) { throw 'Paddle engine setup failed' }
          & ./dist/wordcel/wordcel-cli.exe --setup-engine stanza
          if ($LASTEXITCODE -ne 0) { throw 'Stanza engine setup failed' }
          & ./dist/wordcel/wordcel-cli.exe --check-optional-runtimes
          if ($LASTEXITCODE -ne 0) { throw 'Optional engine check failed' }

      - name: verify installation and data preservation
        run: |
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/wordcel'
          $dataDir = Join-Path $env:LOCALAPPDATA 'wordcel'
          $settingsKey = 'HKCU:\Software\wordcel\wordcel'
          $marker = [guid]::NewGuid().ToString()
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          New-Item -Path $settingsKey -Force | Out-Null
          Set-ItemProperty -Path $settingsKey -Name release_install_smoke -Value $marker
          $markerFile = Join-Path $dataDir 'release-install-smoke.txt'
          Set-Content -Path $markerFile -Value $marker
          foreach ($attempt in 1..2) {
            $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installation $attempt failed: $($process.ExitCode)" }
            & (Join-Path $installDir 'wordcel-cli.exe') --check-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Installed runtime check failed' }
            if ((Get-Content $markerFile -Raw).Trim() -ne $marker) { throw 'Installation changed saved data' }
            if ((Get-ItemPropertyValue -Path $settingsKey -Name release_install_smoke) -ne $marker) { throw 'Installation changed settings' }
          }

      - name: upload windows artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: wordcel-windows-x64
          path: |
            dist/*-setup.exe

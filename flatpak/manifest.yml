id: io.github.namidanokisetsu.wordcel
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.10"
command: "wordcel"
finish-args:
  - "--socket=x11"
  - "--socket=wayland"
  - "--device=dri"
  - "--share=ipc"
  - "--share=network"
  - --talk-name=org.kde.StatusNotifierWatcher
  - "--filesystem=xdg-config/wordcel:rw"
  - "--filesystem=xdg-data/wordcel:rw"
modules:
  - python3-deps.json
  - name: wordcel
    buildsystem: simple
    build-commands:
      - |
        python3 - << 'EOF'
        from PIL import Image
        img = Image.open("src/wordcel/resources/icon.ico")
        img.save("icon.png")
        EOF
      - pip3 install --no-index --find-links=. --prefix=/app --no-build-isolation
        --no-deps .
      - install -Dm644 flatpak/wordcel.desktop /app/share/applications/io.github.namidanokisetsu.wordcel.desktop
      - install -Dm644 flatpak/metainfo.xml /app/share/metainfo/io.github.namidanokisetsu.wordcel.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.namidanokisetsu.wordcel.png
    sources:
      - type: dir
        path: ..
